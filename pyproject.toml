[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "global-korean-collection-agent"
version = "0.1.0"
description = "Autonomous Korean business and diaspora collection agent with Google Sheets persistence"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["agent*"]
